# Every hour: copy the live Prompt Batch price list from mansify.app (its launch-coupon count comes from Freemius)
# to this site, because Prompt Batch 1.0.0 reads prompt-batch/prices.json from here. Commits only when it changed.
name: Sync launch prices
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: sync-prices
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy prices.json from mansify.app when it changed
        run: |
          curl -fsS --max-time 20 https://mansify.app/prompt-batch/prices.json -o /tmp/prices.json
          # Only a real price list goes out: these fields must be there and be numbers.
          jq -e '(.monthly|type)=="number" and (.lifetime|type)=="number" and (.off|type)=="number"' /tmp/prices.json > /dev/null
          if cmp -s <(jq -S . /tmp/prices.json) <(jq -S . prompt-batch/prices.json); then echo "No change"; exit 0; fi
          cp /tmp/prices.json prompt-batch/prices.json
          git config user.name "khaledme10"
          git config user.email "33207535+khaledme10@users.noreply.github.com"
          git commit -am "Launch coupons left: $(jq .launchLeft /tmp/prices.json)"
          git push
